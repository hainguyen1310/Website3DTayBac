name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: SEO smoke test (renderer)
        run: |
          npm run dev -- --port 5199 --strictPort &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5199/robots.txt && break
            sleep 2
          done
          node scripts/seo-check.mjs http://localhost:5199 --offline
